name: Release

# Publish a self-contained .exe to GitHub Releases when a version tag is pushed.
# Tag format:  customs-vX.Y.Z  ->  UnimexCustoms.exe
# The tag's number MUST match CUSTOMS_VERSION in _version.py (checked below), or
# the build fails fast. The customs team's installed exe sees the new release and
# self-updates on the next run that hits a problem.

on:
  push:
    tags:
      - "customs-v*"

permissions:
  contents: write        # needed for `gh release create`

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Resolve version from tag
        id: meta
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          case "$TAG" in
            customs-v*) ;;
            *) echo "::error::Unknown tag prefix: $TAG"; exit 1 ;;
          esac
          echo "tag_ver=${TAG#*-v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches _version.py
        shell: bash
        run: |
          CODE_VER=$(python -c "import _version; print(_version.CUSTOMS_VERSION)")
          echo "tag=${{ steps.meta.outputs.tag_ver }}  code=$CODE_VER"
          if [ "$CODE_VER" != "${{ steps.meta.outputs.tag_ver }}" ]; then
            echo "::error::Tag version ${{ steps.meta.outputs.tag_ver }} != _version.py $CODE_VER. Bump _version.py or fix the tag."
            exit 1
          fi

      - name: Build exe (same flags as build.bat, UPX off)
        run: >
          python -m PyInstaller --onefile --console --clean --noupx
          --name UnimexCustoms customs_processor.py

      - name: Create GitHub Release and upload asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/UnimexCustoms.exe" \
            --title "UnimexCustoms $GITHUB_REF_NAME" \
            --notes "Automated release for $GITHUB_REF_NAME. See CHANGELOG.md for details."
